services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: caporal-postgres
    environment:
      POSTGRES_USER: caporal
      POSTGRES_PASSWORD: caporal
      POSTGRES_DB: caporal
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caporal -d caporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  compute:
    build:
      context: ../services/compute
      dockerfile: Dockerfile
    container_name: caporal-compute
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: caporal
      DB_PASSWORD: caporal
      DB_NAME: caporal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: caporal-api
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: caporal
      DB_PASSWORD: caporal
      DB_NAME: caporal
      COMPUTE_BASE_URL: http://compute:8000
      COMPUTE_TIMEOUT_MS: 5000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      compute:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ../apps/api:/workspace/apps/api
      - ../packages/contracts:/workspace/packages/contracts
      - ../tsconfig.base.json:/workspace/tsconfig.base.json:ro

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: caporal-web
    depends_on:
      api:
        condition: service_started
    ports:
      - "5174:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/web:/workspace/apps/web
      - ../tsconfig.base.json:/workspace/tsconfig.base.json:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: caporal-nginx
    depends_on:
      - api
      - compute
      - web
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
